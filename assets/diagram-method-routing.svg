<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Fixed method routing for new or multi-step work and for failures">
<title>Method routing: fixed rules for planning and for failures</title>
<rect width="1000" height="480" fill="#EADCC4"/>
<text x="24" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#8C1E14">Method routing — fixed rules, minimum sufficient method</text>
<rect x="24" y="64" width="464" height="372" rx="8" fill="#F7F0E2" stroke="#8C1E14" stroke-width="1.5"/>
<rect x="24" y="64" width="464" height="44" fill="#8C1E14"/>
<text x="256" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#EADCC4" text-anchor="middle" letter-spacing="1.2">NEW OR MULTI-STEP WORK</text>
<text x="44" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8C1E14">1  Fix success criteria before building</text>
<text x="44" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">a checkable outcome, stated up front</text>
<text x="44" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8C1E14">2  Compare two or three real options</text>
<text x="44" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">check existing features, libraries and</text>
<text x="44" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">off-the-shelf before proposing to build;</text>
<text x="44" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">include deferring or doing nothing — or</text>
<text x="44" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">rule it out in one line with the reason</text>
<text x="44" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8C1E14">3  Shortest verifiable increment first</text>
<text x="44" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">and name the check that confirms it</text>
<text x="44" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8C1E14">4  Prioritize and decide on evidence</text>
<text x="44" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">impact/effort or Pareto; weighted criteria,</text>
<text x="44" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">not vibes</text>
<text x="44" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8C1E14">5  Estimate as a range, with a basis</text>
<text x="44" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">name the largest driver of the estimate</text>
<rect x="512" y="64" width="464" height="372" rx="8" fill="#F7F0E2" stroke="#8C1E14" stroke-width="1.5"/>
<rect x="512" y="64" width="464" height="44" fill="#8C1E14"/>
<text x="744" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#EADCC4" text-anchor="middle" letter-spacing="1.2">SOMETHING WENT WRONG</text>
<text x="532" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8C1E14">1  Pin the observable, then reproduce</text>
<text x="532" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">what, when, how often — before theorizing</text>
<text x="532" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8C1E14">2  Route the cause hunt by signal</text>
<text x="532" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">recurring, unclear cause — Five Whys (branching)</text>
<text x="532" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">several causal families — Ishikawa</text>
<text x="532" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">foreseeable failure modes ahead — FMEA</text>
<text x="532" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">categorized data to prioritize — Pareto</text>
<text x="532" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">recurring human error to prevent — Poka-Yoke</text>
<text x="532" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">controlled improvement cycle — PDCA</text>
<text x="532" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8C1E14">3  Label every hypothesis</text>
<text x="532" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">assumed, supported, verified, or open —</text>
<text x="532" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">never present an unverified cause as fact</text>
<text x="532" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8C1E14">4  Countermeasures in three layers</text>
<text x="532" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">immediate relief, cause correction, system</text>
<text x="532" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4A120C">improvement — each linked to a cause, with checks</text>
<text x="24" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#4A120C">the router is normally invisible — conclusions and evidence, never a method catalogue</text>
</svg>
